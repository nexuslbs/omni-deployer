# Local S3 (MinIO) service for the deploy's S3 backup/restore/checkpoint test.
#
# deploy.py adds this overlay via `-f docker-compose.minio.yml` so the
# omnideploy project gets a local S3 endpoint that the toolbox backup scripts
# (backup.sh / checkpoint.sh / restore_backup.sh / restore_checkpoint.sh) can
# round-trip against without touching real object storage.
#
# This file lives in the omni-deployer repo (not omni-stack): it is deploy
# tooling, not stack runtime config - deploy.py resolves it relative to
# SCRIPT_DIR (this repo). See deploy.py compose_cmd() and
# test_s3_backup_restore().
#
# IMAGE PROVENANCE - OURS, NOT SOMEBODY ELSE'S:
#   ghcr.io/nexuslbs/omni-images/minio
# is built and published by our own repo nexuslbs/omni-images (minio/Dockerfile
# + .github/workflows/publish.yml) from the OFFICIAL upstream MinIO release
# binary RELEASE.2025-09-07T16-13-09Z, checksum-verified at build time.
#
# Why there is no upstream image to use: the Docker Hub repo `minio/minio` no
# longer exists (pull => "repository does not exist or may require 'docker
# login'", CI run 136), quay.io/minio/minio answers "no such manifest" for every
# tag (CI run 142, release v0.3.3) and dl.min.io now answers HTTP 410 for every
# community release. Digest-pinning a third-party community MinIO fork from a
# personal namespace was a hybrid-only workaround: an artifact nobody in
# nexuslbs controls, whose availability on the CI runner is not guaranteed.
# This image is pulled from our
# own namespace, so CI and hybrid pull the EXACT SAME image reference.
#
# Pinned by DIGEST (immutable, never :latest). The digest below is the image
# published by the omni-images CI run for tag v1.0.0 (commit aa03f0b):
#   ghcr.io/nexuslbs/omni-images/minio@sha256:124755d2da81ad97fc9b1a727f1e01df87b8b6665e4cdb732f57a68fed89666e
# The GHCR package is PUBLIC: the omni-images workflow re-pulls it with no
# credentials, and a clean host pull without credentials works too.
#
# Interface relied upon: `minio server /data --console-address ":9001"` serves
# :9000 and the image ships curl, so the healthcheck below and deploy.py's
# in-container readiness probe (`curl -f http://localhost:9000/minio/health/live`)
# keep working.
#
# Credentials are generated by deploy.py generate_env() and passed through
# omni.env (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD / S3_ACCESS_KEY /
# S3_SECRET_KEY - the same pair is used for both, so the toolbox rclone client
# authenticates against MinIO with the root credentials).
#
# Bump: tag a new release in nexuslbs/omni-images, let CI publish it, then
# replace the digest above (procedure: minio/README.md "How to bump").
services:
  minio:
    image: ghcr.io/nexuslbs/omni-images/minio@sha256:124755d2da81ad97fc9b1a727f1e01df87b8b6665e4cdb732f57a68fed89666e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    logging:
      driver: journald

volumes:
  minio-data:
