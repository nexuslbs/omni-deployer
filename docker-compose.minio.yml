# Local S3 (MinIO) service for the deploy's S3 backup/restore/checkpoint test.
#
# deploy.py adds this overlay via `-f docker-compose.minio.yml` so the
# omnideploy project gets a local S3 endpoint that the toolbox backup scripts
# (backup.sh / checkpoint.sh / restore_backup.sh / restore_checkpoint.sh) can
# round-trip against without touching real object storage.
#
# This file lives in the omni-deployer repo (not omni-stack): it is deploy
# tooling, not stack runtime config - deploy.py resolves it relative to
# SCRIPT_DIR (this repo). See deploy.py compose_cmd() and
# test_s3_backup_restore().
#
# Image pinned to the last fixed MinIO release (never :latest):
#   RELEASE.2025-09-07T16-13-09Z
# Credentials are generated by deploy.py generate_env() and passed through
# omni.env (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD / S3_ACCESS_KEY /
# S3_SECRET_KEY - the same pair is used for both, so the toolbox rclone client
# authenticates against MinIO with the root credentials).
services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    logging:
      driver: journald

volumes:
  minio-data:
