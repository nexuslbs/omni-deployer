# Local S3 (MinIO) service for the deploy's S3 backup/restore/checkpoint test.
#
# deploy.py adds this overlay via `-f docker-compose.minio.yml` so the
# omnideploy project gets a local S3 endpoint that the toolbox backup scripts
# (backup.sh / checkpoint.sh / restore_backup.sh / restore_checkpoint.sh) can
# round-trip against without touching real object storage.
#
# This file lives in the omni-deployer repo (not omni-stack): it is deploy
# tooling, not stack runtime config - deploy.py resolves it relative to
# SCRIPT_DIR (this repo). See deploy.py compose_cmd() and
# test_s3_backup_restore().
#
# Image pinned by DIGEST (immutable, never :latest) from the maintained MinIO
# community fork pgsty/minio. The official images are gone: the Docker Hub repo
# `minio/minio` no longer exists (pull => "repository does not exist or may
# require 'docker login'", CI run 136) and quay.io/minio/minio now answers
# "no such manifest" for every tag (CI run 142, release v0.3.3), which broke
# the integration test at `docker compose up -d`.
# The fork is built from the MinIO release binary on the same ubi9-micro base
# as the official image (curl present, same entrypoint), so the compose
# healthcheck (`curl -f /minio/health/live`) and deploy.py's in-container curl
# check keep working. Verified locally: `minio server /data` serves :9000 and
# /minio/health/live returns 200.
#   pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
# Credentials are generated by deploy.py generate_env() and passed through
# omni.env (MINIO_ROOT_USER / MINIO_ROOT_PASSWORD / S3_ACCESS_KEY /
# S3_SECRET_KEY - the same pair is used for both, so the toolbox rclone client
# authenticates against MinIO with the root credentials).
services:
  minio:
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    logging:
      driver: journald

volumes:
  minio-data:
