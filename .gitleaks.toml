# gitleaks config for omni-deployer (code-plan C9 never-commit guardrail).
# [extend] loads gitleaks' full default rule set; committed workflow/test
# fixtures that reference secret formats without live values are excluded
# in the allowlist below. New secrets anywhere else fail `gitleaks detect`.
title = "omni-deployer gitleaks config (code-plan C9)"

[extend]
useDefault = true

[allowlist]
description = "Committed deployer fixtures referencing secret formats without real values"
paths = [
  '''\.github/workflows/plugins\.yml''',
  '''\.github/workflows/publish\.yml''',
  '''scripts/tests\.py''',
]
