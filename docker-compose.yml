# Wrapper compose for the omnidev project (tester thread 350).
# Replicates omni-stack docker-compose.yml + docker-compose.dev.yml for the
# omniagent service only (postgres/qdrant already run as omnidev containers and
# are adopted by name). Project name comes from omnidev.env
# (COMPOSE_PROJECT_NAME=omnidev), so 'up' adopts/recreates omnidev-omniagent-1.
name: omnidev

services:
  omniagent:
    image: omniagent-dev:latest
    build:
      context: /opt/workspace/omniagent
      dockerfile: Dockerfile.dev
    command: /target/release/omniagent
    environment:
      DATABASE_URL: postgres://omniagent:${POSTGRES_PASSWORD}@postgres:5432/omniagent
      OMNI_DIR: ${OMNI_DIR:-/opt/omni}
      CARGO_TARGET_DIR: /target
      SQLX_OFFLINE: "false"
    volumes:
      - /opt/workspace/omniagent:/app:rw
      - /opt/workspace/omni-stack:/opt/omni:rw
      - /opt/workspace:/opt/workspace:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/target
    expose:
      - "8080"
    networks:
      - default

networks:
  default:
    name: omnidev_default
    external: true

volumes:
  cargo-registry:
    name: omnidev_cargo-registry
    external: true
  cargo-target:
    name: omnidev_cargo-target
    external: true
