name: Publish images

on:
  push:
    branches:
      - stable
    tags:
      - 'v*'

jobs:
  build-omniagent:
    name: Build omniagent
    runs-on: ubuntu-latest
    permissions:
      contents: read
  
    outputs:
      tag: ${{ steps.image-tag.outputs.tag }}
      labels: ${{ steps.meta.outputs.labels }}
      sha: ${{ steps.sha.outputs.sha }}
  
    steps:
      - name: Checkout omniagent
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omniagent
          path: omniagent

      - name: Record checkout SHA
        id: sha
        run: echo "sha=$(git -C omniagent rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nexuslbs/omni-deployer/omniagent
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/stable' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
  
      - name: Get single image tag
        id: image-tag
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep ':sha-' | head -1)
          echo "tag=$FIRST_TAG" >> "$GITHUB_OUTPUT"
  
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: omniagent
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # RELEASE build: bake OMNIAGENT_BUILD_MODE=release so db-migrations
          # auto-applies the idempotent schema on container start against the
          # live DB (version upgrades need NO manual env vars). The Dockerfile
          # ARG default is dev (fail closed): any image built without this arg
          # stays fully guarded against non-dev databases.
          build-args: |
            OMNIAGENT_BUILD_MODE=release
  
      - name: Save image
        run: docker save $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ') | gzip > /tmp/omniagent.tar.gz
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniagent-image
          path: /tmp/omniagent.tar.gz
          retention-days: 1
  
  build-omni-dashboard:
    name: Build omni-dashboard
    runs-on: ubuntu-latest
    permissions:
      contents: read
  
    outputs:
      tag: ${{ steps.image-tag.outputs.tag }}
      labels: ${{ steps.meta.outputs.labels }}
      sha: ${{ steps.sha.outputs.sha }}
  
    steps:
      - name: Checkout omni-dashboard
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omni-dashboard
          path: omni-dashboard

      - name: Record checkout SHA
        id: sha
        run: echo "sha=$(git -C omni-dashboard rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nexuslbs/omni-deployer/dashboard
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/stable' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
  
      - name: Get single image tag
        id: image-tag
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep ':sha-' | head -1)
          echo "tag=$FIRST_TAG" >> "$GITHUB_OUTPUT"
  
      - name: Lint and build
        run: |
          cd omni-dashboard
          npm ci
          npm run lint || true
          npm run build
  
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: omni-dashboard
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  
      - name: Save image
        run: docker save $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ') | gzip > /tmp/omni-dashboard.tar.gz
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-dashboard-image
          path: /tmp/omni-dashboard.tar.gz
          retention-days: 1
  
  build-toolbox:
    name: Build toolbox
    runs-on: ubuntu-latest
    permissions:
      contents: read
  
    outputs:
      tag: ${{ steps.image-tag.outputs.tag }}
      labels: ${{ steps.meta.outputs.labels }}
      sha: ${{ steps.sha.outputs.sha }}
  
    steps:
      - name: Checkout omni-stack
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omni-stack
          path: omni-stack

      - name: Record checkout SHA
        id: sha
        run: echo "sha=$(git -C omni-stack rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/nexuslbs/omni-deployer/toolbox
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/stable' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
  
      - name: Get single image tag
        id: image-tag
        run: |
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | grep ':sha-' | head -1)
          echo "tag=$FIRST_TAG" >> "$GITHUB_OUTPUT"
  
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: omni-stack/services/toolbox
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  
      - name: Save image
        run: docker save $(echo "${{ steps.meta.outputs.tags }}" | tr '\n' ' ') | gzip > /tmp/toolbox.tar.gz
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-image
          path: /tmp/toolbox.tar.gz
          retention-days: 1
  # CONSISTENCY CONTRACT (hybrid == CI):
  # The integration job must test EXACTLY the code the images were built from:
  # each dependent repo is checked out at the SHA its image job built (recorded
  # in the build jobs' `sha` outputs), so source-audit tests (GROUP 43/49) read
  # the same omniagent/omni-dashboard/omni-stack state the running containers
  # come from. Hybrid is bound to the same origin/main contract by the
  # deploy.py hybrid preflight (Step 0.4): local checkouts must be clean and at
  # origin/main, or hybrid refuses to run. A test failure therefore appears in
  # hybrid AND CI or in neither; a stale source audit (e.g. 49-E) cannot pass
  # in one and fail in the other.

  
  integration-test:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: [build-omniagent, build-omni-dashboard, build-toolbox]
    permissions:
      contents: read
  
    steps:
      - name: Checkout omni-deployer
        uses: actions/checkout@v4
        with:
          path: omni-deployer
  
      - name: Checkout omni-stack
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omni-stack
          path: omni-stack
          ref: ${{ needs.build-toolbox.outputs.sha }}
  
      - name: Checkout omniagent
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omniagent
          path: omniagent
          ref: ${{ needs.build-omniagent.outputs.sha }}
  
      - name: Checkout omni-dashboard
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omni-dashboard
          path: omni-dashboard
          ref: ${{ needs.build-omni-dashboard.outputs.sha }}
  
      - name: Checkout omni-plugins
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omni-plugins
          path: omni-plugins
          fetch-depth: 0
  
      - name: Download omniagent image
        uses: actions/download-artifact@v4
        with:
          name: omniagent-image
          path: /tmp/images/omniagent
  
      - name: Download dashboard image
        uses: actions/download-artifact@v4
        with:
          name: omni-dashboard-image
          path: /tmp/images/dashboard
  
      - name: Download toolbox image
        uses: actions/download-artifact@v4
        with:
          name: toolbox-image
          path: /tmp/images/toolbox
  
      - name: Load images
        run: |
          for f in /tmp/images/*/*.tar.gz; do
            gunzip -c "$f" | docker load
          done
  
      - name: Run integration tests
        env:
          WORKSPACE_DIR: ${{ github.workspace }}
          OMNIAGENT_IMAGE: ${{ needs.build-omniagent.outputs.tag }}
          DASHBOARD_IMAGE: ${{ needs.build-omni-dashboard.outputs.tag }}
          TOOLBOX_IMAGE: ${{ needs.build-toolbox.outputs.tag }}
        run: |
          cd omni-deployer
          python3 deploy.py ci

  publish:
    name: Publish stable + images
    runs-on: ubuntu-latest
    needs: [build-omniagent, build-omni-dashboard, build-toolbox, integration-test]
    permissions:
      contents: write
      packages: write

    steps:
      # ── Determine version info ─────────────────────────────
      - name: Determine version
        id: version
        run: |
          IS_TAG=false
          VERSION=""
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            IS_TAG=true
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "IS_TAG=$IS_TAG" >> $GITHUB_OUTPUT


      # ── Fail-fast: release tag must match repo versions ──────────────
      # Before ANY push or tag, verify omniagent Cargo.toml and
      # omni-dashboard package.json versions equal the tag (v-stripped).
      # Any mismatch aborts the publish job before anything is pushed.
      - name: Checkout omniagent for version check
        if: steps.version.outputs.IS_TAG == 'true'
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omniagent
          path: version-check-omniagent
          ref: ${{ needs.build-omniagent.outputs.sha }}

      - name: Checkout omni-dashboard for version check
        if: steps.version.outputs.IS_TAG == 'true'
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omni-dashboard
          path: version-check-omni-dashboard
          ref: ${{ needs.build-omni-dashboard.outputs.sha }}

      - name: Verify release versions match tag
        if: steps.version.outputs.IS_TAG == 'true'
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${TAG_VERSION#v}"
          AGENT_VER="$(grep -m1 '^version' version-check-omniagent/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          DASH_VER="$(python3 -c 'import json;print(json.load(open("version-check-omni-dashboard/package.json"))["version"])')"
          if [ "$AGENT_VER" != "$TAG_VERSION" ]; then
            echo "::error::omniagent Cargo.toml version ${AGENT_VER} != tag version ${TAG_VERSION}" >&2
            exit 1
          fi
          if [ "$DASH_VER" != "$TAG_VERSION" ]; then
            echo "::error::omni-dashboard package.json version ${DASH_VER} != tag version ${TAG_VERSION}" >&2
            exit 1
          fi
          echo "OK: omniagent ${AGENT_VER} == omni-dashboard ${DASH_VER} == tag ${TAG_VERSION}"
      # ── Update omni-stack ───────────────────────────────────
      - name: Checkout omni-stack
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omni-stack
          path: omni-stack
          persist-credentials: false

      - name: Push omni-stack stable branch
        run: |
          cd omni-stack
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/nexuslbs/omni-stack.git
          git push origin HEAD:stable --force

      - name: Tag omni-stack
        if: steps.version.outputs.IS_TAG == 'true'
        run: |
          cd omni-stack
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # ── Update omniagent ────────────────────────────────────
      - name: Checkout omniagent
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omniagent
          path: omniagent
          persist-credentials: false

      - name: Push omniagent stable branch
        run: |
          cd omniagent
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/nexuslbs/omniagent.git
          git push origin HEAD:stable --force

      - name: Tag omniagent
        if: steps.version.outputs.IS_TAG == 'true'
        run: |
          cd omniagent
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # ── Update omni-dashboard ───────────────────────────────
      - name: Checkout omni-dashboard
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omni-dashboard
          path: omni-dashboard
          persist-credentials: false

      - name: Push omni-dashboard stable branch
        run: |
          cd omni-dashboard
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/nexuslbs/omni-dashboard.git
          git push origin HEAD:stable --force

      - name: Tag omni-dashboard
        if: steps.version.outputs.IS_TAG == 'true'
        run: |
          cd omni-dashboard
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # ── Update omni-plugins ──────────────────────────────────
      - name: Checkout omni-plugins
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omni-plugins
          path: omni-plugins
          persist-credentials: false

      - name: Push omni-plugins stable branch
        run: |
          cd omni-plugins
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/nexuslbs/omni-plugins.git
          git push origin HEAD:stable --force

      - name: Tag omni-plugins
        if: steps.version.outputs.IS_TAG == 'true'
        run: |
          cd omni-plugins
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      # ── Publish Docker images ──────────────────────────────
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Download and push omniagent
        uses: actions/download-artifact@v4
        with:
          name: omniagent-image
          path: /tmp/push/omniagent
      
      - name: Download and push dashboard
        uses: actions/download-artifact@v4
        with:
          name: omni-dashboard-image
          path: /tmp/push/dashboard
      
      - name: Download and push toolbox
        uses: actions/download-artifact@v4
        with:
          name: toolbox-image
          path: /tmp/push/toolbox
      
      - name: Push omniagent image
        run: |
          gunzip -c /tmp/push/omniagent/omniagent.tar.gz | docker load
          for tag in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'ghcr.io/nexuslbs/omni-deployer/omniagent'); do
            docker push "$tag"
          done
      
      - name: Push dashboard image
        run: |
          gunzip -c /tmp/push/dashboard/omni-dashboard.tar.gz | docker load
          for tag in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'ghcr.io/nexuslbs/omni-deployer/dashboard'); do
            docker push "$tag"
          done
      
      - name: Push toolbox image
        run: |
          gunzip -c /tmp/push/toolbox/toolbox.tar.gz | docker load
          for tag in $(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'ghcr.io/nexuslbs/omni-deployer/toolbox'); do
            docker push "$tag"
          done
