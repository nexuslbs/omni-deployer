name: Plugins CI

# Runs the omni-plugins test suite (deploy_plugins.py ci) when the
# omni-deployer `plugins` branch is pushed, then pushes the omni-plugins
# main branch to `tests-passed` as the ONLY external change.
on:
  push:
    branches:
      - plugins

jobs:
  plugins-ci:
    name: Plugins CI (deploy_plugins.py ci)
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push omni-plugins main -> tests-passed

    steps:
      - name: Checkout omni-deployer (commit's own code)
        uses: actions/checkout@v4
        with:
          path: omni-deployer

      - name: Checkout omni-stack
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omni-stack
          path: omni-stack

      - name: Checkout omni-plugins
        uses: actions/checkout@v4
        with:
          repository: nexuslbs/omni-plugins
          path: omni-plugins
          fetch-depth: 0

      - name: Run deploy_plugins.py ci
        env:
          WORKSPACE_DIR: ${{ github.workspace }}
        run: |
          cd omni-deployer
          python3 deploy_plugins.py ci

      - name: Push omni-plugins main -> tests-passed
        run: |
          cd omni-plugins
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/nexuslbs/omni-plugins.git
          git push origin HEAD:refs/heads/tests-passed --force