[[tests.outputs.conditions]]
type = "vrl"
source = '.level == "error"'

[[tests.outputs.conditions]]
type = "vrl"
source = '.message == "boom"'

[[tests.outputs.conditions]]
type = "vrl"
source = '.stream == "stdout"'

[[tests.outputs.conditions]]
type = "vrl"
source = '.stream_path == "out"'

[[tests.outputs.conditions]]
type = "vrl"
source = '.container == "web-1"'
