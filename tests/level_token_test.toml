# Vector test suite for the remap_logs transform (services/vector/transforms.toml).
#
# This file is a FRAGMENT: run_tests.sh concatenates it AFTER the real
# transforms.toml into one combined config, so the suite always exercises the
# shipped pipeline (no copy, no drift). It is NOT copied by the Dockerfile
# (which copies only sources/transforms/sinks.toml), so it never ships in the
# image.
#
# Covers the fix: for non-JSON container log lines, _my_level/_stream/_stream_path
# are derived from the level token in the message (regex \b(DEBUG|INFO|WARN|ERROR|CRITICAL)\b)
# instead of blindly trusting journald PRIORITY. JSON lines stay unchanged; lines
# without a level token fall back to the PRIORITY-based behavior.
#
# Notes on the harness (vector 0.55 test mode):
#   - sources/sinks are stripped and replaced by per-transform test sources, so
#     insert_at/extract_from must target the transform name (remap_logs).
#   - input type "raw" only sets the message (log_fields are ignored);
#     use type "log" with log_fields to inject journald/GELF fields (message
#     must be given as one of the log_fields).
#   - Fallback expectations below document the CURRENT (pre-fix) behavior:
#     VRL int() does not coerce "6"/"3" so the section-3 normalization is
#     skipped and the raw PRIORITY string stays in .level; streams still come
#     from to_int(PRIORITY). The fix must not change these cases.

# --- Non-JSON journald container log: ERROR token must override PRIORITY=6 ---
[[tests]]
name = "non-json container ERROR token overrides PRIORITY=6"

[[tests.inputs]]
insert_at = "remap_logs"
type = "log"
[tests.inputs.log_fields]
message = "2026-08-31 10:00:00 ERROR something went wrong"
CONTAINER_NAME = "web-1"
IMAGE_NAME = "myapp/web:latest"
PRIORITY = "6"

[[tests.outputs]]
extract_from = "remap_logs"

[[tests.outputs.conditions]]
type = "vrl"
source = '.level == "ERROR"'

[[tests.outputs.conditions]]
type = "vrl"
source = '.stream == "stderr"'

[[tests.outputs.conditions]]
type = "vrl"
source = '.stream_path == "error"'

[[tests.outputs.conditions]]
type = "vrl"
source = '.container == "web-1"'

[[tests.outputs.conditions]]
type = "vrl"
source = '.service == "web"'

