# --- No level token AND no PRIORITY: pre-existing fallback unchanged ---
# (unknown-level -> to_int yields 0 -> stderr/error stream, level defaulted to
# INFO by the pre-existing 3.5 block; the fix must not touch this case)
[[tests]]
name = "no token no PRIORITY keeps pre-existing fallback"

[[tests.inputs]]
insert_at = "remap_logs"
type = "log"
[tests.inputs.log_fields]
message = "2026-08-31 10:00:00 plain line without level"
_container_name = "api-1"
_service_name = "api"

[[tests.outputs]]
extract_from = "remap_logs"

[[tests.outputs.conditions]]
type = "vrl"
source = '.level == "INFO"'

[[tests.outputs.conditions]]
type = "vrl"
source = '.stream == "stderr"'

[[tests.outputs.conditions]]
type = "vrl"
source = '.stream_path == "error"'

[[tests.outputs.conditions]]
type = "vrl"
source = '.container == "api-1"'

# --- JSON container log: unchanged (level/message kept from JSON) ---
